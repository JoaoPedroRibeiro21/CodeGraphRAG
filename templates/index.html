<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRChat</title>

    <link rel="stylesheet" href="/files/style.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/jwt-decode@3/build/jwt-decode.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="/files/script.js" defer></script>
</head>
<body>
    <div id="login-container">
        <div class="login-card">
            <div class="logo">🤖</div>
            <h1>VRChat</h1>
            <p>Faça login para acessar o chat com documentos</p>
            <div id="g_id_onload"
                 data-client_id="<YOUR_GOOGLE_CLIENT_ID>"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin" data-type="standard"></div>
        </div>
    </div>

    <div id="chat-container" style="display: none;">
        <div class="container">
            <div class="split-layout">
                <div class="preview-pane">
                    <iframe id="pdfPreview" src="" frameborder="0"></iframe>
                </div>
                <div class="chat-pane">
                    <div class="header">
                        <h1>Chat com Documentos VRSoftware</h1>
                        <p>Faça perguntas sobre o conteúdo da VRWiki ou Banco de Conhecimento</p>
                        <a href="https://wiki.vrsoft.com.br">VRWiki</a><br>
                        <a href="https://drive.google.com/drive/folders/1JSqtLkPs-zcNUQFdyOHi4eyKBbTOPSO3?usp=sharing">Base de Conhecimento</a>
                    </div>

                    <div class="chat-container" id="chatContainer">
                        <div class="empty-state">
                            <div class="empty-state-icon">💬</div>
                            <h3>Bem-vindo ao Chat!</h3>
                            <p>Faça uma pergunta sobre o documento para começar a conversa.</p>
                        </div>
                    </div>

                    <div class="input-container">
                        <div class="input-group">
                            <textarea id="messageInput" class="input-field" placeholder="Digite sua pergunta aqui..." rows="1"></textarea>
                            <button id="sendButton" class="send-button">Enviar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
