services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: vrchat
      POSTGRES_USER: vrchat
      POSTGRES_PASSWORD: vrchat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vrchat -d vrchat"]
      interval: 5s
      timeout: 5s
      retries: 5

  vrchat:
    build:
      context: .
      dockerfile: dockerfile
      args:
        OPENAI_API_KEY: ${OPENAI_API_KEY}
    container_name: vrchat
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      CODE_GRAPH_BACKGROUND_REFRESH: "true"
      CODE_GRAPH_REFRESH_INTERVAL_HOURS: "12"
      CODE_GRAPH_REBUILD_TTL_HOURS: "336"
      CODE_VERIFICATION_REPAIR_ATTEMPTS: "0"
      CODE_ANALYSIS_TIMEOUT_SECONDS: "8"
      CODE_ANALYSIS_BUDGET_SECONDS: "6"
      CODE_BATCH_TOKEN_LIMIT: "14000"
      CODE_NODE_CHUNK_TOKEN_LIMIT: "4000"
      CODE_ANALYSIS_MAX_NODES_LIGHT: "6"
      CODE_ANALYSIS_MAX_NODES_DEEP: "8"
      HIDE_INTERNAL_LIMITATIONS: "true"
      ENABLE_BENCH_API: "true"
    volumes:
      - ./chroma_graph_db:/app/chroma_graph_db:Z
      - ./arquivos/chat_retrieval_db:/app/arquivos/chat_retrieval_db:Z
      - code_graph_data:/app/code_graph_storage
      - repos_sources_data:/app/repos_sources

volumes:
  redis_data:
  postgres_data:
  code_graph_data:
  repos_sources_data:
