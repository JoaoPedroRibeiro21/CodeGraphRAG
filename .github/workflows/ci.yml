name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Compile Python files
        run: |
          python -m py_compile app_chainlit.py build_graph.py code_analysis_pipeline.py code_artifacts.py preCarregaGrafo.py preCarregaDataBase.py question_classifier.py graph_retrieval.py retrieval_orchestrator.py retrieval_validator.py adaptive_retrieval.py sync_repos.py refresh_code_index.py loader.py vector_db.py init_db.py cleanup_db.py setup_config.py
          python -m py_compile src/codexgraph_rag/*.py src/codexgraph_rag/**/*.py

      - name: Run tests
        run: |
          python -m pytest -q
