<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRChat</title>

    <!-- CSS local -->
    <link rel="stylesheet" href="/files/style.css" />

    <!-- Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/jwt-decode@3/build/jwt-decode.min.js"></script>

    <!-- JS local -->
    <script src="/files/script.js" defer></script>
</head>
<body>
    <!-- Tela de Login -->
    <div id="login-container">
        <div class="login-card">
            <div class="logo">🤖</div>
            <h1>VRChat</h1>
            <p>Faça login para acessar o chat com documentos</p>
            
            <div id="g_id_onload"
                 data-client_id="<YOUR_GOOGLE_CLIENT_ID>"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin" data-type="standard"></div>
        </div>
    </div>

    <!-- Tela do Chat -->
    <div id="chat-container" style="display: none;">
        <div class="container">
            <div class="header">
                <div class="header-top">
                    <div class="status-indicator" id="statusIndicator"></div>
                    <button onclick="logout()" class="logout-button">Logout</button>
                </div>

                <h1>Chat com Documentos VRSoftware</h1>
                <p>Faça perguntas sobre o conteúdo da VRWiki ou Banco de Conhecimento</p>
                <br>
                <a href="https://wiki.vrsoft.com.br">VRWiki</a>
                <br>
                <a href="https://drive.google.com/drive/folders/1JSqtLkPs-zcNUQFdyOHi4eyKBbTOPSO3?usp=sharing">Base de Conhecimento</a>
            </div>
            
            <div class="chat-container" id="chatContainer">
                <div class="empty-state">
                    <div class="empty-state-icon">💬</div>
                    <h3>Bem-vindo ao Chat!</h3>
                    <p>Faça uma pergunta sobre o documento para começar a conversa.</p>
                </div>
            </div>
            
            <div class="input-container">
                <div class="input-group">
                    <textarea 
                        id="messageInput" 
                        class="input-field" 
                        placeholder="Digite sua pergunta aqui..."
                        rows="1"
                    ></textarea>
                    <button id="sendButton" class="send-button">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22,2 15,22 11,13 2,9"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
