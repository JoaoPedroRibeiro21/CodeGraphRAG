<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VRChat</title>
  
  <link rel="stylesheet" href="/files/style.css" />
  <link rel="icon" type="image/x-icon" href="/files/images/perfil_vr1.png">
  
  </head>
<body>
  
  <div id="login-container">
    <div class="login-card" aria-label="Tela de login">
      <img src="/files/images/perfil_vr1.png" alt="Logo VRChat" style="height: 164px; width: auto;" />
      <h1>VRChat</h1>
      <p>Faça login para acessar a plataforma</p>
      <div id="g_id_onload"
           data-client_id="<YOUR_GOOGLE_CLIENT_ID>"
           data-callback="handleCredentialResponse"
           data-auto_prompt="false">
      </div>
      <div class="g_id_signin" data-type="standard"></div>
    </div>
  </div>

  <div id="chat-container" style="display: none;">
    <div class="container">
      <div class="split-layout full-chat">
        <aside class="preview-pane" aria-label="Visualização do documento">
          <iframe id="pdfPreview" src="" frameborder="0" title="Preview do PDF"></iframe>
        </aside>

        <main class="chat-pane">
          <header class="header">
            <div class="header-main">
              <div class="title-block">
                <h1>VRChat</h1>
                <p>Pergunte informações técnicas sobre o VRMaster</p>
              </div>
              <div class="user-info" aria-label="Informações do usuário logado" hidden>
                <div class="avatar-wrapper">
                  <img id="user-avatar" src="" alt="Avatar do usuário" />
                </div>
                <div class="user-details">
                  <div id="user-name">Usuário</div>
                  <div id="user-email">email@exemplo.com</div>
                </div>
                <button id="logoutBtn" class="logout-button" aria-label="Sair">Sair</button>
              </div>
            </div>
            <div class="links-bar">
              <a href="https://wiki.vrsoft.com.br" target="_blank" rel="noopener">VRWiki</a>
              <span class="separator">•</span>
              <a href="https://drive.google.com/drive/folders/1JSqtLkPs-zcNUQFdyOHi4eyKBbTOPSO3?usp=sharing" target="_blank" rel="noopener">Base de Conhecimento</a>
              <div class="status-indicator" id="system-status" title="Status do sistema">
                <span class="dot"></span> <span class="label">Conectado</span>
              </div>
            </div>
          </header>

          <section id="chat-area" class="chat-container" aria-live="polite">
            <div class="empty-state">
              <div class="empty-state-icon">💬</div>
              <h3>Bem-vindo ao Chat!</h3>
              <p>Como posso ajudar hoje?</p>
            </div>
          </section>

          <footer class="input-container">
            <div class="input-group">
              <textarea id="messageInput" class="input-field" placeholder="Digite sua mensagem aqui..." rows="1" aria-label="Campo de pergunta" ></textarea>
              <button id="sendButton" class="send-button" aria-label="Enviar pergunta" disabled>
                <span class="btn-text">Enviar</span>
              </button>
                <div class="spinner" aria-hidden="true" hidden></div>
              </button>
            </div>
          </footer>
        </main>
      </div>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <script src="https://cdn.jsdelivr.net/npm/jwt-decode@3/build/jwt-decode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  
  <script src="/files/script.js"></script>

</body>
</html>
