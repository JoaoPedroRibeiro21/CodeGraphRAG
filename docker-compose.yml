version: "3.8"

services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  vrchat:
    build:
      context: .
      dockerfile: dockerfile
    container_name: vrchat
    expose:
      - "8000"
    depends_on:
      - redis
    # Adiciona esta seção para passar as variáveis do .env
    env_file:
      - .env

  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./files:/usr/share/nginx/html/files
    ports:
      - "80:80"
    depends_on:
      - vrchat

  # certbot:
  #   image: certbot/certbot
  #   container_name: certbot
  #   volumes:
  #     - ./certbot/www:/var/www/certbot
